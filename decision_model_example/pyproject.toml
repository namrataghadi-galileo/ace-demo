[project]
name = "ace-decision-model-example"
version = "0.1.0"
description = "Interactive banking demo for a Galileo Decision Models tool control"
requires-python = ">=3.12,<3.15"
dependencies = [
  "agent-control-sdk[galileo,otel]>=8.14.0",
  "agent-control-models>=8.14.0",
  "agent-control-engine>=8.14.0",
  "agent-control-telemetry>=8.14.0",
  "galileo[otel]>=2.6.0",
  "httpx>=0.26.0",
  "python-dotenv>=1.0.0",
  "streamlit>=1.36",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.11.0"]

[tool.uv]
package = false

# Temporary test-only overrides: galileo.decision_models is being exercised
# from the local Agent Control feature checkout with a Jev scorer. Once a
# release contains the Decision Models evaluator, remove these sources, pin the
# SDK above to that published version, and regenerate uv.lock.
[tool.uv.sources]
agent-control-sdk = { path = "../../agent-control/sdks/python", editable = true }
agent-control-models = { path = "../../agent-control/models", editable = true }
agent-control-engine = { path = "../../agent-control/engine", editable = true }
agent-control-telemetry = { path = "../../agent-control/telemetry", editable = true }
agent-control-evaluators = { path = "../../agent-control/evaluators/builtin", editable = true }
agent-control-evaluator-galileo = { path = "../../agent-control/evaluators/contrib/galileo", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
