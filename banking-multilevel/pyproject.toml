[project]
name = "ace-banking-multilevel-example"
version = "0.1.0"
description = "Five-level Streamlit banking demo for Agent Control and Orbit runtime scorers"
requires-python = ">=3.12,<3.15"
dependencies = [
  "agent-control-sdk[galileo,otel]==8.13.0",
  "galileo[otel]>=2.3.0",
  "httpx>=0.26.0",
  "python-dotenv>=1.0.0",
  "streamlit>=1.36",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.11.0"]

[tool.uv]
package = false

# Agent Control 8.13.0 comes from PyPI. The local galileo-python checkout is
# temporarily required for retriever_call, trace_call, and session_call control
# spans. Once those changes are published, pin `galileo[otel]` above to that
# PyPI version, remove this path override, and regenerate uv.lock.
[tool.uv.sources]
galileo = { path = "../../galileo-python", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
