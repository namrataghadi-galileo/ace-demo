[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-galileo-e2e"
version = "0.1.0"
description = "Standalone banking demo for Agent Control evaluations emitted as Galileo control spans."
requires-python = ">=3.12,<3.15"
dependencies = [
  "galileo[openai,otel]>=2.3.0",
  "agent-control-sdk[galileo,otel]==8.7.0",
  "agent-control-evaluators==8.7.0",
  "agent-control-evaluator-galileo==8.7.0",
  "httpx>=0.26.0",
  "streamlit>=1.36",
]

[tool.setuptools]
py-modules = [
  "banking_streamlit_app",
  "banking_streamlit_app_otel",
  "common",
  "run_demo",
  "run_demo_otel",
  "setup_controls",
  "slm_runtime_controls",
  "slm_runtime_streamlit_app",
]
